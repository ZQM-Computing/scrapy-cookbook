name: Cookbook examples

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrapy-cookbook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-spider:
    name: First spider unit tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: examples/01-first-spider/requirements.txt
      - name: Install pinned dependency
        run: python -m pip install -r examples/01-first-spider/requirements.txt
      - name: Run offline parser tests
        run: python -m unittest discover -s examples/01-first-spider -p 'test_*.py' -v

  postgres-export:
    name: PostgreSQL export unit tests (no database)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: examples/01-first-spider/requirements.txt
      - name: Install pinned Scrapy dependency
        run: python -m pip install -r examples/01-first-spider/requirements.txt
      - name: Run PostgreSQL pipeline contract tests
        run: python -m unittest discover -s examples/04-postgres-export -p 'test_*.py' -v

  postgres-integration:
    name: PostgreSQL 15 integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: scrapy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scrapy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SCRAPY_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/scrapy_test
      SCRAPY_POSTGRES_ALLOW_DESTRUCTIVE_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: examples/04-postgres-export/requirements.txt
      - name: Install PostgreSQL example dependencies
        run: python -m pip install -r examples/04-postgres-export/requirements.txt
      - name: Install PostgreSQL 15 client utilities
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl postgresql-common
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-15
          pg_dump --version
      - name: Run live PostgreSQL integration tests
        run: python -m unittest discover -s examples/04-postgres-export -p 'test_postgres_integration.py' -v
      - name: Run PostgreSQL backup and restore smoke test
        run: python -m unittest discover -s examples/04-postgres-export -p 'test_postgres_backup_restore.py' -v
